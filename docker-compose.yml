services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: learnpath
      POSTGRES_PASSWORD: learnpath
      POSTGRES_DB: learnpath
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnpath"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://learnpath:learnpath@db:5432/learnpath
      JWT_SECRET: dev-only-secret-change-me-in-production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Mount the source for live reload during development.
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    image: node:20-alpine
    working_dir: /web
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/web
      - web_node_modules:/web/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
